spring.application.name=ChangeGraph-Backend

server.port=1213

spring.config.import=optional:classpath:application-local.properties

falkordb.host=r-6jissuruar.instance-zyk9jpvqc.hc-7up0crkyn.ap-south-1.aws.f2e0a955bb84.cloud
falkordb.port=59251

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/changegraph}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migrations stay opt-in. Set FLYWAY_ENABLED=true when you approve applying them.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

changegraph.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
changegraph.security.password.min-length=${PASSWORD_MIN_LENGTH:10}
changegraph.security.auth.max-attempts=${AUTH_MAX_ATTEMPTS:10}
changegraph.security.auth.window-seconds=${AUTH_WINDOW_SECONDS:60}
changegraph.security.cookie.secure=${SESSION_COOKIE_SECURE:false}

changegraph.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
changegraph.github.connect-timeout-ms=${GITHUB_CONNECT_TIMEOUT_MS:5000}
changegraph.github.request-timeout-ms=${GITHUB_REQUEST_TIMEOUT_MS:15000}
changegraph.github.max-retries=${GITHUB_MAX_RETRIES:1}
changegraph.github.poll-interval-minutes=${GITHUB_POLL_INTERVAL_MINUTES:30}

changegraph.ingestion.max-files=${INGESTION_MAX_FILES:40}
changegraph.ingestion.max-file-bytes=${INGESTION_MAX_FILE_BYTES:200000}
changegraph.analysis.upstream-depth=${ANALYSIS_UPSTREAM_DEPTH:3}
changegraph.analysis.downstream-depth=${ANALYSIS_DOWNSTREAM_DEPTH:2}
changegraph.analysis.max-nodes=${ANALYSIS_MAX_NODES:100}

# OpenAI-compatible chat completions. Leave the key empty to use deterministic fallback.
changegraph.llm.base-url=${CHANGEGRAPH_LLM_BASE_URL:https://api.openai.com/v1}
# LLM key: set changegraph.llm.api-key in gitignored application-local.properties
# or CHANGEGRAPH_LLM_API_KEY. Do not put the key in this file; a value here
# overrides the local file.

changegraph.llm.model=${CHANGEGRAPH_LLM_MODEL:gpt-4o-mini}
changegraph.llm.timeout-ms=${CHANGEGRAPH_LLM_TIMEOUT_MS:20000}
changegraph.llm.max-output-tokens=${CHANGEGRAPH_LLM_MAX_OUTPUT_TOKENS:700}
changegraph.agent.max-tool-calls=${CHANGEGRAPH_AGENT_MAX_TOOL_CALLS:5}
changegraph.agent.max-iterations=${CHANGEGRAPH_AGENT_MAX_ITERATIONS:4}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.springframework.security.web.authentication=WARN
