spring.application.name=ChangeGraph-Backend

server.port=1213

spring.config.import=optional:classpath:application-local.properties

# Host and port stay on the existing FalkorDB instance unless FALKORDB_HOST / FALKORDB_PORT are set.
# Docker Compose sets those to its own FalkorDB service. Username and password stay out of this file.
falkordb.host=${FALKORDB_HOST:<your_falkordb_host>}
falkordb.port=${FALKORDB_PORT:<your_falkordb_port>}

spring.datasource.url=${POSTGRES_URL:<your_postgres_url>}
spring.datasource.username=${POSTGRES_USER:<your_postgres_username>}
spring.datasource.password=${POSTGRES_PASSWORD:<your_postgres_password>}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migrations stay opt-in. Set FLYWAY_ENABLED=true when you approve applying them.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

changegraph.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
changegraph.security.password.min-length=${PASSWORD_MIN_LENGTH:10}
changegraph.security.auth.max-attempts=${AUTH_MAX_ATTEMPTS:10}
changegraph.security.auth.window-seconds=${AUTH_WINDOW_SECONDS:60}
changegraph.security.cookie.secure=${SESSION_COOKIE_SECURE:false}

changegraph.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
changegraph.github.connect-timeout-ms=${GITHUB_CONNECT_TIMEOUT_MS:5000}
changegraph.github.request-timeout-ms=${GITHUB_REQUEST_TIMEOUT_MS:15000}
changegraph.github.max-retries=${GITHUB_MAX_RETRIES:1}
# Used when GitHub can deliver webhooks. Localhost and an empty webhook secret poll every minute instead.
changegraph.github.poll-interval-minutes=${GITHUB_POLL_INTERVAL_MINUTES:30}
changegraph.github.poll-initial-delay-ms=${GITHUB_POLL_INITIAL_DELAY_MS:15000}
changegraph.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:<your_github_webhook_secret>}

changegraph.ingestion.max-files=${INGESTION_MAX_FILES:40}
changegraph.ingestion.max-file-bytes=${INGESTION_MAX_FILE_BYTES:200000}
changegraph.analysis.upstream-depth=${ANALYSIS_UPSTREAM_DEPTH:3}
changegraph.analysis.downstream-depth=${ANALYSIS_DOWNSTREAM_DEPTH:2}
changegraph.analysis.max-nodes=${ANALYSIS_MAX_NODES:100}

# OpenAI-compatible chat completions. Leave the key empty to use deterministic fallback.
# Base URL, model, and key belong in gitignored application-local.properties, or in
# CHANGEGRAPH_LLM_BASE_URL, CHANGEGRAPH_LLM_MODEL, and CHANGEGRAPH_LLM_API_KEY.
# Environment variables override that file. Defaults live on the client:
# https://api.openai.com/v1 and gpt-4o-mini.
changegraph.llm.timeout-ms=${CHANGEGRAPH_LLM_TIMEOUT_MS:60000}
changegraph.llm.max-output-tokens=${CHANGEGRAPH_LLM_MAX_OUTPUT_TOKENS:2000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.org.springframework.security.web.authentication=WARN
