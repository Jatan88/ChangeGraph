spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:changegraph;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

changegraph.cors.allowed-origin=http://localhost:5173
changegraph.security.password.min-length=10
changegraph.security.auth.max-attempts=20
changegraph.security.auth.window-seconds=60
changegraph.security.cookie.secure=false

changegraph.github.api-base-url=https://api.github.com
changegraph.github.connect-timeout-ms=500
changegraph.github.request-timeout-ms=1000
changegraph.github.max-retries=0

changegraph.ingestion.max-files=40
changegraph.ingestion.max-file-bytes=200000
changegraph.analysis.upstream-depth=3
changegraph.analysis.downstream-depth=2
changegraph.analysis.max-nodes=100

server.servlet.session.cookie.secure=false
